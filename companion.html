<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrea — Sélection du compagnon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="screen" aria-label="Sélection du compagnon">
      <img class="screen-bg" src="assets/background-companions.png" alt="Sélection du compagnon dans la taverne">
      <div class="stage-shadow stage-shadow--pet"></div>
      <div class="stage stage--pet"><img id="petSprite" class="sprite" alt=""></div>
      <div class="hotspots pet-hotspots">
        <button class="card-btn pet-btn" data-pet="tiger" aria-label="Tigre glacial"></button>
        <button class="card-btn pet-btn" data-pet="gelapuf" aria-label="Gélapuf"></button>
        <button class="card-btn pet-btn" data-pet="deer" aria-label="Biche étoilée"></button>
      </div>
      <button id="petNext" class="nav-btn nav-btn--next" aria-label="Suivant"></button>
      <button id="petBack" class="nav-btn nav-btn--back" aria-label="Retour"></button>
      <div id="petStatus" class="status-pill"></div>
    </section>
  </main>
  <script src="js/companions.js"></script>
</body>
</html>
