<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07152a" />
  <title>Astrea — Sélection des classes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page" aria-label="Création de personnage Astrea">
    <section class="game" id="game" aria-label="Sélection des classes">
      <img
        class="background"
        src="assets/background-character-selection.png"
        alt="Écran de création de personnage dans une taverne, avec quatre classes à sélectionner"
        draggable="false"
      />

      <div class="stage-glow" id="stageGlow" aria-hidden="true"></div>

      <div class="character-stage" aria-live="polite">
        <img
          id="selectedCharacter"
          class="character character--knight"
          src="assets/class-knight.png"
          alt="Chevalier sélectionné"
          draggable="false"
        />
      </div>

      <div class="class-buttons" aria-label="Choisir une classe">
        <button class="class-hitbox is-selected" data-class="knight" aria-label="Sélectionner le Chevalier" aria-pressed="true"></button>
        <button class="class-hitbox" data-class="hunter" aria-label="Sélectionner le Chasseur" aria-pressed="false"></button>
        <button class="class-hitbox" data-class="wizard" aria-label="Sélectionner le Sorcier" aria-pressed="false"></button>
        <button class="class-hitbox" data-class="sage" aria-label="Sélectionner le Sage" aria-pressed="false"></button>
      </div>

      <button class="nav-hitbox nav-hitbox--next" id="nextButton" aria-label="Valider la classe et continuer"></button>
      <button class="nav-hitbox nav-hitbox--back" id="backButton" aria-label="Retour"></button>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
