<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrea — Sélection des classes</title>
  <meta name="theme-color" content="#07152a">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="screen screen--class" aria-label="Création de personnage">
      <div class="screen-bg" style="background-image:url('assets/background-character-selection.png')"></div>

      <div class="stage-mask" id="stageMask" aria-hidden="true"></div>
      <div class="hero-stage" aria-live="polite">
        <img id="heroImage" class="hero-image hero-image--hidden" alt="">
      </div>

      <div class="hotspots hotspots--classes" aria-label="Choix de la classe">
        <button class="hotspot class-card is-selected" data-class="knight" aria-label="Choisir le Chevalier" title="Choisir le Chevalier"></button>
        <button class="hotspot class-card" data-class="hunter" aria-label="Choisir le Chasseur" title="Choisir le Chasseur"></button>
        <button class="hotspot class-card" data-class="wizard" aria-label="Choisir le Sorcier" title="Choisir le Sorcier"></button>
        <button class="hotspot class-card" data-class="sage" aria-label="Choisir le Sage" title="Choisir le Sage"></button>
      </div>

      <button id="nextButton" class="hotspot nav-button nav-button--next" aria-label="Continuer vers la sélection du compagnon" title="Continuer"></button>
      <button id="backButton" class="hotspot nav-button nav-button--back" aria-label="Retour" title="Retour"></button>

      <div class="selection-chip" id="selectionChip">Classe sélectionnée : Chevalier</div>
    </section>
  </main>
  <script src="js/class-selection.js"></script>
</body>
</html>
