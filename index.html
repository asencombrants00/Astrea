<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152a">
  <title>Astrea — Sélection des classes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="screen screen--class" aria-label="Création de personnage">
      <div class="screen-bg screen-bg--class" aria-hidden="true"></div>

      <div class="hero-stage" aria-live="polite">
        <img
          id="heroImage"
          class="hero-image is-visible"
          src="assets/class-knight.png"
          data-class="knight"
          alt="Chevalier sélectionné"
          draggable="false"
        >
      </div>

      <div class="hotspots hotspots--classes" aria-label="Choisir une classe">
        <button class="hotspot class-card is-selected" data-class="knight" aria-label="Choisir le Chevalier" aria-pressed="true"></button>
        <button class="hotspot class-card" data-class="hunter" aria-label="Choisir le Chasseur" aria-pressed="false"></button>
        <button class="hotspot class-card" data-class="wizard" aria-label="Choisir le Sorcier" aria-pressed="false"></button>
        <button class="hotspot class-card" data-class="sage" aria-label="Choisir le Sage" aria-pressed="false"></button>
      </div>

      <button id="nextButton" class="hotspot nav-button nav-button--next" aria-label="Continuer vers la sélection du compagnon"></button>
      <button id="backButton" class="hotspot nav-button nav-button--back" aria-label="Retour"></button>

      <p id="selectionStatus" class="sr-only" aria-live="polite">Chevalier sélectionné</p>
    </section>
  </main>
  <script src="js/class-selection.js"></script>
</body>
</html>
